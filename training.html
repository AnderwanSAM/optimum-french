<!doctype html>
<html lang="en-CA" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training | Optimum French</title>
  <meta name="description" content="Optimum French prepares you for the TCF Canada and TEF Canada tests.">
  <meta name="theme-color" content="#c8102e">
  <link rel="icon" href="assets/img/maple-leaf.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,700&family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="training" data-title="meta.training.title" data-description="meta.training.desc">
  <header class="site-header"></header>

  <main id="main">
    <section class="page-hero plain">
      <div class="wrap">
        <h1 data-i18n="tr.title">Training</h1>
      </div>
    </section>

    <section class="section section-cream">
      <div class="wrap test-grid">
        <article class="test-card reveal" id="tcf">
          <div class="cover"><img src="assets/img/texture-ice.jpg" alt="" loading="lazy"><span class="title">TCF <span>Canada</span></span></div>
          <div class="body">
            <p data-i18n="tr.tcf.text"></p>
            <a class="link-arrow" href="https://www.af.ca/ottawa/en/tests_et_examens/tcf-canada/" target="_blank" rel="noopener" data-i18n="cta.learn">Learn more</a>
          </div>
        </article>

        <article class="test-card reveal" id="tef">
          <div class="cover"><img src="assets/img/texture-sand.jpg" alt="" loading="lazy"><span class="title">TEF <span>Canada</span></span></div>
          <div class="body">
            <p data-i18n="tr.tef.text"></p>
            <a class="link-arrow" href="https://www.alliance-francaise.ca/en/exams/tests/tef-canada" target="_blank" rel="noopener" data-i18n="cta.learn">Learn more</a>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
