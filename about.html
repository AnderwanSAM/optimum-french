<!doctype html>
<html lang="en-CA" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About the School | Optimum French</title>
  <meta name="description" content="Optimum French was built by two French as a second language teachers.">
  <meta name="theme-color" content="#c8102e">
  <link rel="icon" href="assets/img/maple-leaf.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,700&family=Poppins:wght@300;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="about" data-title="meta.about.title" data-description="meta.about.desc">
  <header class="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="hero-bg"><img src="assets/img/canada-flag.jpg" alt=""></div>
      <div class="wrap">
        <h1 data-i18n="ab.title">About the School</h1>
      </div>
    </section>

    <section class="section" id="history">
      <div class="wrap">
        <div class="prose reveal">
          <h2 data-i18n="about.history.title">Our History</h2>
          <p data-i18n="ab.history.p1"></p>
          <p data-i18n="ab.history.p2"></p>
        </div>
      </div>
    </section>

    <section class="section section-cream">
      <div class="wrap about-grid two">
        <article class="about-card reveal" id="virtual">
          <h3 data-i18n="about.virtual.title">Our Virtual Training Center</h3>
          <p data-i18n="ab.virtual.text"></p>
        </article>
        <article class="about-card reveal" id="staff">
          <h3 data-i18n="about.staff.title">Our Teaching Staff</h3>
          <p data-i18n="about.staff.short"></p>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
